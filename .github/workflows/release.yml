# Builds Windows and Linux binaries on a version tag and publishes a GitHub
# Release. The in-app updater (Wails GitHub provider) picks the asset whose
# name contains the OS and arch, and verifies it against SHA256SUMS.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies (GTK4, WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Test
        run: go test ./internal/...

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          wails3 build VERSION="$VERSION"
          wails3 build GOOS=windows VERSION="$VERSION"

      - name: Package
        run: |
          mkdir dist
          tar -czf dist/drstats-linux-amd64.tar.gz -C bin drstats
          (cd bin && zip -q ../dist/drstats-windows-amd64.zip drstats.exe)
          (cd dist && sha256sum drstats-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
