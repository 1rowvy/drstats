<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d212a"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc061"/>
      <stop offset="1" stop-color="#f08a12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffad33" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffad33" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffad33" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="70" y="70" width="884" height="884" rx="194" fill="none" stroke="url(#rim)" stroke-width="12"/>
  <!-- bars -->
  <rect x="236" y="560" width="132" height="236" rx="28" fill="url(#bar)" opacity=".45"/>
  <rect x="446" y="430" width="132" height="366" rx="28" fill="url(#bar)" opacity=".72"/>
  <rect x="656" y="282" width="132" height="514" rx="28" fill="url(#bar)"/>
  <!-- trend line -->
  <polyline points="232,470 430,330 600,372 792,190" fill="none" stroke="#f4f5f7" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="792" cy="190" r="46" fill="#f4f5f7"/>
  <circle cx="792" cy="190" r="20" fill="#ffad33"/>
</svg>
